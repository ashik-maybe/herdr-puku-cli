name: test

on:
  push:
    branches: [main, plugin-support]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Shellcheck
        run: shellcheck -S warning bin/herdr-agent-state.sh scripts/lib.sh scripts/install.sh tests/run.sh
      - name: Test suite
        run: ./tests/run.sh
